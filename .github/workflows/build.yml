name: PARKSENSE CI

# Her gönderimde: analiz + testler, Windows (Setup + Portable) ve Android (APK)
# derlemesi, gerçek uygulama üzerinde öz-sınama, kurulum/kaldırma testi ve
# Android emülatöründe uçtan uca test. Sürüm etiketlerinde (v*) GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.50.1'
  APP_VERSION: '1.0.0'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analiz + birim/entegrasyon/arayüz testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Statik analiz
        shell: bash
        run: flutter analyze | tee analyze.txt
      - name: Testler
        shell: bash
        run: flutter test --reporter expanded | tee test.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-raporu
          path: |
            analyze.txt
            test.txt

  windows:
    name: Windows (Setup.exe + Portable.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Derle
        run: flutter build windows --release
      - name: VC++ çalışma zamanı DLL'lerini uygulamanın yanına koy
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          foreach ($d in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR\System32\$d" $rel -ErrorAction SilentlyContinue
          }
          Get-ChildItem $rel | Format-Table Name, Length

      - name: Açılış süresi ve bellek ölçümü
        shell: pwsh
        run: |
          $cap = "$pwd\capture\windows"; New-Item -ItemType Directory -Force $cap | Out-Null
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath "build\windows\x64\runner\Release\PARKSENSE.exe" -PassThru
          while ($sw.Elapsed.TotalSeconds -lt 60) { $p.Refresh(); if ($p.MainWindowHandle -ne 0) { break }; Start-Sleep -Milliseconds 50 }
          $open = [int]$sw.Elapsed.TotalMilliseconds
          Start-Sleep -Seconds 10; $p.Refresh()
          $ws = [int]($p.WorkingSet64/1MB); $priv = [int]($p.PrivateMemorySize64/1MB)
          "Pencere açılış süresi: $open ms · 10 sn sonra WorkingSet: $ws MB · Private: $priv MB · çalışıyor: $(-not $p.HasExited)" | Tee-Object "$cap\performance.txt"
          Stop-Process -Id $p.Id -Force

      - name: Gerçek uygulamayı çalıştır (öz-sınama + ekran görüntüleri)
        shell: pwsh
        run: |
          $cap = "$pwd\capture\windows"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath "build\windows\x64\runner\Release\PARKSENSE.exe" -ArgumentList "--capture=$cap" -PassThru
          $peak = 0
          while (-not $p.HasExited -and $sw.Elapsed.TotalSeconds -lt 420) {
            Start-Sleep -Seconds 2
            try { $p.Refresh(); if ($p.WorkingSet64 -gt $peak) { $peak = $p.WorkingSet64 } } catch {}
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force; "UYARI: zaman aşımı" | Out-File -Append "$cap\selftest.txt" }
          "Öz-sınama süresi: $([int]$sw.Elapsed.TotalSeconds) sn · en yüksek bellek (WorkingSet): $([int]($peak/1MB)) MB · çıkış kodu: $($p.ExitCode)" | Out-File -Append "$cap\selftest.txt"
          Get-Content "$cap\selftest.txt"

      - name: PARKSENSE-Setup.exe (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$env:APP_VERSION /DSourceDir="$pwd\build\windows\x64\runner\Release" installer\parksense.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Kurulum + kısayol + kaldırma testi
        shell: pwsh
        run: |
          $log = "$pwd\capture\windows\install_test.txt"
          $dir = "$env:LOCALAPPDATA\PARKSENSE-Test"
          $p = Start-Process "dist\PARKSENSE-Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/TASKS=desktopicon","/DIR=`"$dir`"" -Wait -PassThru
          "Kurulum çıkış kodu: $($p.ExitCode)" | Tee-Object -Append $log
          "Program dosyası: $(Test-Path "$dir\PARKSENSE.exe")" | Tee-Object -Append $log
          $sm = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "PARKSENSE*.lnk" -ErrorAction SilentlyContinue
          "Başlat menüsü kısayolları: $($sm.Name -join ', ')" | Tee-Object -Append $log
          "Masaüstü kısayolu: $(Test-Path "$([Environment]::GetFolderPath('Desktop'))\PARKSENSE.lnk")" | Tee-Object -Append $log
          $u = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue | Where-Object DisplayName -like "PARKSENSE*"
          "Programlar ve Özellikler kaydı: $($u.DisplayName) $($u.DisplayVersion)" | Tee-Object -Append $log
          $app = Start-Process "$dir\PARKSENSE.exe" -PassThru; Start-Sleep 12; $app.Refresh()
          "Kurulu uygulama çalışıyor: $(-not $app.HasExited)" | Tee-Object -Append $log
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue; Start-Sleep 2
          $un = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep 3
          "Kaldırma çıkış kodu: $($un.ExitCode) · program klasörü silindi: $(-not (Test-Path "$dir\PARKSENSE.exe"))" | Tee-Object -Append $log

      - name: PARKSENSE-Portable.exe (tek dosya, kurulumsuz)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          $ok = $false
          foreach ($v in "2501","2409","2408") {
            try { Invoke-WebRequest "https://www.7-zip.org/a/lzma$v.7z" -OutFile tools\lzma.7z; $ok = $true; break } catch {}
          }
          if (-not $ok) { throw "LZMA SDK indirilemedi" }
          7z x tools\lzma.7z -otools\lzma -y | Out-Null
          $sfx = Get-ChildItem tools\lzma -Recurse -Filter 7zS2.sfx | Select-Object -First 1
          Copy-Item $sfx.FullName tools\stub.sfx
          Invoke-WebRequest "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile tools\rcedit.exe
          & tools\rcedit.exe tools\stub.sfx --set-icon windows\runner\resources\app_icon.ico `
            --set-version-string ProductName PARKSENSE --set-version-string FileDescription "PARKSENSE Portable" `
            --set-version-string CompanyName Furkan --set-version-string LegalCopyright "(C) 2026 Furkan" `
            --set-file-version $env:APP_VERSION --set-product-version $env:APP_VERSION
          Push-Location build\windows\x64\runner\Release
          7z a -t7z -m0=LZMA -mx=7 -mf=off ..\..\..\..\..\tools\app.7z * | Out-Null
          Pop-Location
          cmd /c copy /b tools\stub.sfx + tools\app.7z dist\PARKSENSE-Portable.exe
          Get-ChildItem dist | Format-Table Name, Length

      - name: Portable sürümü çalıştırma testi
        shell: pwsh
        run: |
          $log = "$pwd\capture\windows\portable_test.txt"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process "dist\PARKSENSE-Portable.exe" -PassThru
          $app = $null
          while ($sw.Elapsed.TotalSeconds -lt 60 -and -not $app) { Start-Sleep -Milliseconds 250; $app = Get-Process PARKSENSE -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 } }
          "Portable: pencere açıldı=$([bool]$app) · süre $([int]$sw.Elapsed.TotalMilliseconds) ms (ayıklama dâhil)" | Tee-Object $log
          Start-Sleep 8
          $app = Get-Process PARKSENSE -ErrorAction SilentlyContinue
          "Portable: 8 sn sonra çalışıyor=$([bool]$app)" | Tee-Object -Append $log
          $app | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep 3
          "Portable SFX süreci kapandı=$($p.HasExited)" | Tee-Object -Append $log

      - name: Windows klasörü (zip)
        shell: pwsh
        run: |
          $dst = "dist\PARKSENSE-Windows"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item dist\PARKSENSE-Setup.exe, dist\PARKSENSE-Portable.exe $dst
          Compress-Archive -Path $dst -DestinationPath "dist\PARKSENSE-Windows-$env:APP_VERSION.zip"
          Get-FileHash dist\*.exe, dist\*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File dist\SHA256SUMS-windows.txt
          Get-Content dist\SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS-windows.txt
            capture/windows

  android:
    name: Android (imzalı APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: İmza anahtarı (GitHub Secrets; yoksa bu derlemeye özel geçici anahtar)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.jks
            PASS="$KS_PASS"; echo "Kalıcı anahtar (GitHub Secrets) kullanılıyor"
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore android/app/release.jks -alias parksense -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Furkan, O=PARKSENSE, C=TR" >/dev/null 2>&1
            echo "UYARI: Secrets tanımlı değil; bu derleme için geçici anahtar üretildi (bkz. docs/INSTALLATION.md)"
          fi
          printf "storeFile=release.jks\nstorePassword=%s\nkeyAlias=parksense\nkeyPassword=%s\n" "$PASS" "$PASS" > android/key.properties
      - name: Sürüm APK
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/PARKSENSE.apk
      - name: Öz-sınama APK'sı (yalnızca CI ekran görüntüleri için)
        run: |
          flutter build apk --release --dart-define=PARKSENSE_CAPTURE=true
          cp build/app/outputs/flutter-apk/app-release.apk capture-selftest.apk
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BT/apksigner verify --print-certs dist/PARKSENSE.apk | head -4 | tee dist/apk_signature.txt
          $BT/aapt2 dump badging dist/PARKSENSE.apk | grep -E "^package|application-label:|uses-permission|sdkVersion|targetSdk" | tee -a dist/apk_signature.txt
          sha256sum dist/PARKSENSE.apk | tee dist/SHA256SUMS-android.txt
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            dist/
            capture-selftest.apk

  emulator:
    name: Android emülatör (kurulum, izin, açılış, gerçek veri)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tool/ci/android_e2e.sh apk/dist/PARKSENSE.apk apk/capture-selftest.apk capture/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-e2e
          path: capture/android

  publish:
    name: Derlenmiş dosyaları yayınla
    needs: [test, windows, android, emulator]
    if: always() && needs.windows.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: src }
      - uses: actions/download-artifact@v4
        with: { name: windows, path: out/windows }
      - uses: actions/download-artifact@v4
        with: { name: android, path: out/android }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: android-e2e, path: out/android-e2e }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: test-raporu, path: out/test }
      - name: builds dalına gönder
        run: |
          cd out
          rm -f android/capture-selftest.apk
          echo "Derleme: ${GITHUB_SHA} · $(date -u +%FT%TZ) · test=${{ needs.test.result }} emulator=${{ needs.emulator.result }}" > BUILD.txt
          git init -q -b builds && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Derleme ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
      - name: GitHub Release (sürüm etiketlerinde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PARKSENSE ${{ github.ref_name }}
          body_path: src/CHANGELOG.md
          files: |
            out/windows/dist/PARKSENSE-Setup.exe
            out/windows/dist/PARKSENSE-Portable.exe
            out/windows/dist/PARKSENSE-Windows-*.zip
            out/android/dist/PARKSENSE.apk
            out/windows/dist/SHA256SUMS-windows.txt
            out/android/dist/SHA256SUMS-android.txt
